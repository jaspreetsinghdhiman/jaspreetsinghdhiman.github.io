<style>
  :root{--bg:#0b0b12;--surface:#14141f;--surface-2:#1b1b29;--violet:#7c6cf3;--violet-soft:rgba(124,108,243,.15);--amber:#f5b94d;--text:#ededf2;--muted:#8b8a9a;--line:rgba(237,237,242,.1);--display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif;--green:#5fd08a;--red:#f16565;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;}
  a{text-decoration:none;color:inherit;}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 5vw;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--violet),var(--amber));display:flex;align-items:center;justify-content:center;color:#0b0b12;font-family:var(--display);font-weight:700;}
  .brand h1{font-family:var(--display);font-size:1.15rem;font-weight:700;}
  .brand p{font-size:.78rem;color:var(--muted);}
  .back{font-size:.85rem;color:var(--muted);border:1px solid var(--line);padding:9px 16px;border-radius:100px;transition:.25s;display:inline-flex;align-items:center;gap:8px;}
  .back:hover{color:var(--text);border-color:var(--violet);background:var(--violet-soft);}
  main{padding:34px 5vw 60px;max-width:1200px;margin:0 auto;}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:26px;}
  .sum-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;}
  .sum-card span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .sum-card b{display:block;font-family:var(--display);font-size:1.8rem;margin-top:6px;}
  .sum-card.income b{color:var(--green);} .sum-card.expense b{color:var(--red);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;}
  .panel h3{font-family:var(--display);font-size:1rem;margin-bottom:16px;}
  form{display:flex;flex-direction:column;gap:12px;}
  .row2{display:flex;gap:12px;}
  input, select{background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:10px;font-family:var(--body);font-size:.9rem;width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--violet);}
  .type-toggle{display:flex;gap:8px;}
  .type-toggle button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;font-weight:600;font-size:.85rem;transition:.2s;}
  .type-toggle button.active.expense{background:rgba(241,101,101,.15);color:var(--red);border-color:var(--red);}
  .type-toggle button.active.income{background:rgba(95,208,138,.15);color:var(--green);border-color:var(--green);}
  form button[type=submit]{background:var(--text);color:#0b0b12;border:none;padding:13px;border-radius:10px;font-weight:600;cursor:pointer;margin-top:4px;}
  canvas{max-width:100%;}
  .list{margin-top:20px;display:flex;flex-direction:column;gap:10px;max-height:260px;overflow-y:auto;}
  .txn{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface-2);border-radius:10px;font-size:.85rem;}
  .txn .cat{color:var(--muted);font-size:.75rem;}
  .txn .amt.income{color:var(--green);} .txn .amt.expense{color:var(--red);}
  .txn .del{background:none;border:none;color:var(--muted);cursor:pointer;margin-left:10px;}
  .txn .del:hover{color:var(--red);}
  .empty{color:var(--muted);font-size:.85rem;text-align:center;padding:30px;}
  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:30px;border-top:1px solid var(--line);margin-top:40px;}
  @media (max-width:820px){ .grid, .summary{grid-template-columns:1fr;} }
</style>

<body id="top"><a class="fix-skip" href="#main-content">Skip to content</a>
<header>
<div class="brand">
<div class="mark"><i class="fa-solid fa-coins"></i></div>
<div><h1>PulseTrack</h1><p>Expense &amp; income tracker</p></div>
</div>
<a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to portfolio</a>
</header>
<main id="main-content">
<div class="summary">
<div class="sum-card income"><span>Total Income</span><b id="totalIncome">₹0</b></div>
<div class="sum-card expense"><span>Total Expense</span><b id="totalExpense">₹0</b></div>
<div class="sum-card"><span>Balance</span><b id="balance">₹0</b></div>
</div>
<div class="grid">
<div class="panel">
<h3>Add Transaction</h3>
<form id="txnForm">
<div class="type-toggle">
<button class="active expense" data-type="expense" id="expBtn" type="button"><i class="fa-solid fa-arrow-down"></i> Expense</button>
<button class="income" data-type="income" id="incBtn" type="button"><i class="fa-solid fa-arrow-up"></i> Income</button>
</div>
<input aria-label="What was it for?" id="txnTitle" placeholder="What was it for?" required="" type="text"/>
<div class="row2">
<input aria-label="Amount (₹)" id="txnAmount" min="0" placeholder="Amount (₹)" required="" step="0.01" type="number"/>
<select aria-label="Input" id="txnCategory">
<option>Food</option><option>Transport</option><option>Shopping</option>
<option>Bills</option><option>Health</option><option>Salary</option><option>Other</option>
</select>
</div>
<button type="submit">Add Transaction</button>
</form>
<div class="list" id="txnList"></div>
</div>
<div class="panel">
<h3>Spending by Category</h3>
<canvas height="420" id="chart" width="420"></canvas>
<div id="legend" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;"></div>
</div>
</div>
</main>
<footer>Data is stored locally in your browser — nothing leaves your device.</footer>
<script>
const KEY = 'pulsetrack-txns-v1';
let txns=[];try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw))txns=raw;}catch(e){}
let currentType = 'expense';
const COLORS = ['#7c6cf3','#f5b94d','#5fd08a','#f16565','#5cc4e8','#e07be0','#c9c94d'];

function save(){ try{localStorage.setItem(KEY, JSON.stringify(txns));}catch(e){} }
function fmt(n){ return '₹' + n.toLocaleString('en-IN', {maximumFractionDigits:0}); }

document.getElementById('expBtn').addEventListener('click', ()=>setType('expense'));
document.getElementById('incBtn').addEventListener('click', ()=>setType('income'));
function setType(t){
  currentType = t;
  document.getElementById('expBtn').classList.toggle('active', t==='expense');
  document.getElementById('incBtn').classList.toggle('active', t==='income');
}

document.getElementById('txnForm').addEventListener('submit', e=>{
  e.preventDefault();
  const title = document.getElementById('txnTitle').value.trim();
  const amount = parseFloat(document.getElementById('txnAmount').value);
  const category = document.getElementById('txnCategory').value;
  if(!title || !Number.isFinite(amount) || amount<=0) return;
  txns.unshift({id: Date.now(), title, type: currentType, amount, category});
  document.getElementById('txnTitle').value = '';
  document.getElementById('txnAmount').value = '';
  save(); render();
});

function render(){
  const income = txns.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
  const expense = txns.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  document.getElementById('totalIncome').textContent = fmt(income);
  document.getElementById('totalExpense').textContent = fmt(expense);
  document.getElementById('balance').textContent = fmt(income - expense);

  const list = document.getElementById('txnList');
  list.innerHTML = txns.length ? '' : '<div class="empty">No transactions yet</div>';
  txns.forEach(t=>{
    const div = document.createElement('div');
    div.className = 'txn';
    div.innerHTML = `<div><div>${escapeHtml(t.title)}</div><div class="cat">${t.category}</div></div>
      <div style="display:flex;align-items:center;"><span class="amt ${t.type}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</span>
      <button class="del" data-id="${t.id}"><i class="fa-solid fa-xmark"></i></button></div>`;
    div.querySelector('.del').addEventListener('click', ()=>{ txns = txns.filter(x=>x.id!==t.id); save(); render(); });
    list.appendChild(div);
  });

  drawChart();
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function drawChart(){
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const byCat = {};
  txns.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category] = (byCat[t.category]||0) + t.amount; });
  const cats = Object.keys(byCat);
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  if(!cats.length){
    ctx.fillStyle = '#8b8a9a';
    ctx.font = '14px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('No expenses to chart yet', canvas.width/2, canvas.height/2);
    return;
  }
  const total = cats.reduce((a,c)=>a+byCat[c],0);
  const cx = canvas.width/2, cy = canvas.height/2, r = Math.min(cx,cy) - 30;
  let start = -Math.PI/2;
  cats.forEach((c,i)=>{
    const slice = (byCat[c]/total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+slice);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();
    start += slice;

    const legItem = document.createElement('div');
    legItem.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:.78rem;color:#8b8a9a;';
    legItem.innerHTML = `<span style="width:10px;height:10px;border-radius:3px;background:${COLORS[i%COLORS.length]};display:inline-block;"></span>${c} (${Math.round(byCat[c]/total*100)}%)`;
    legend.appendChild(legItem);
  });
  ctx.beginPath();
  ctx.arc(cx,cy,r*0.55,0,Math.PI*2);
  ctx.fillStyle = '#14141f';
  ctx.fill();
}

render();
</script>
