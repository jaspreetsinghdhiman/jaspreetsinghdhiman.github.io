<style>
  :root{--bg:#0b0b12;--surface:#14141f;--surface-2:#1b1b29;--violet:#7c6cf3;--violet-soft:rgba(124,108,243,.15);--amber:#f5b94d;--text:#ededf2;--muted:#8b8a9a;--line:rgba(237,237,242,.1);--display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 5vw;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--violet),var(--amber));display:flex;align-items:center;justify-content:center;color:#0b0b12;font-family:var(--display);font-weight:700;}
  .brand h1{font-family:var(--display);font-size:1.15rem;font-weight:700;}
  .brand p{font-size:.78rem;color:var(--muted);}
  .back{font-size:.85rem;color:var(--muted);border:1px solid var(--line);padding:9px 16px;border-radius:100px;transition:.25s;display:inline-flex;align-items:center;gap:8px;}
  .back:hover{color:var(--text);border-color:var(--violet);background:var(--violet-soft);}
  a{text-decoration:none;color:inherit;}
  main{padding:34px 5vw 60px;max-width:1280px;margin:0 auto;}
  .toolbar{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap;}
  .toolbar input{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:13px 16px;border-radius:10px;font-family:var(--body);font-size:.92rem;}
  .toolbar input:focus{outline:none;border-color:var(--violet);}
  .toolbar select{background:var(--surface);border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:10px;font-family:var(--body);}
  .toolbar button{background:var(--text);color:#0b0b12;border:none;padding:13px 22px;border-radius:10px;font-weight:600;cursor:pointer;font-size:.9rem;transition:transform .2s;}
  .toolbar button:hover{transform:translateY(-2px);}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .col{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:400px;display:flex;flex-direction:column;gap:12px;transition:background .2s,border-color .2s;}
  .col.dragover{background:var(--violet-soft);border-color:var(--violet);}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;border-bottom:1px solid var(--line);}
  .col-head h3{font-family:var(--display);font-size:.95rem;letter-spacing:.02em;}
  .count{font-family:monospace;font-size:.75rem;color:var(--muted);background:var(--surface-2);padding:2px 9px;border-radius:100px;}
  .card{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:grab;transition:transform .2s,box-shadow .2s;}
  .card:active{cursor:grabbing;}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(0,0,0,.5);}
  .card.dragging{opacity:.4;}
  .card p{font-size:.9rem;line-height:1.5;}
  .card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .tag{font-size:.68rem;font-family:monospace;padding:3px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:.05em;}
  .tag.low{background:rgba(124,108,243,.15);color:var(--violet);}
  .tag.high{background:rgba(245,185,77,.15);color:var(--amber);}
  .tag.med{background:rgba(139,138,154,.15);color:var(--muted);}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;transition:color .2s;}
  .del:hover{color:#f16565;}
  .empty{color:var(--muted);font-size:.82rem;text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:10px;}
  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:30px;border-top:1px solid var(--line);}
  @media (max-width:820px){ .board{grid-template-columns:1fr;} }
</style>

<body id="top"><a class="fix-skip" href="#main-content">Skip to content</a>
<header>
<div class="brand">
<div class="mark">TF</div>
<div><h1>TaskFlow</h1><p>Drag-and-drop kanban board</p></div>
</div>
<a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to portfolio</a>
</header>
<main id="main-content">
<div class="toolbar">
<input aria-label="Add a new task and press Enter..." id="taskInput" placeholder="Add a new task and press Enter..." type="text"/>
<select aria-label="Input" id="prioritySelect">
<option value="low">Low priority</option>
<option selected="" value="med">Medium priority</option>
<option value="high">High priority</option>
</select>
<button id="addBtn"><i class="fa-solid fa-plus"></i> Add Task</button>
</div>
<div class="board">
<div class="col" data-status="todo">
<div class="col-head"><h3>To Do</h3><span class="count" id="count-todo">0</span></div>
<div class="cards" id="list-todo"></div>
</div>
<div class="col" data-status="doing">
<div class="col-head"><h3>In Progress</h3><span class="count" id="count-doing">0</span></div>
<div class="cards" id="list-doing"></div>
</div>
<div class="col" data-status="done">
<div class="col-head"><h3>Done</h3><span class="count" id="count-done">0</span></div>
<div class="cards" id="list-done"></div>
</div>
</div>
</main>
<footer>Built with vanilla JavaScript — state saved locally in your browser.</footer>
<script>
const KEY = 'taskflow-tasks-v1';
let tasks=[];try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw))tasks=raw;}catch(e){}
let dragId = null;

function save(){ try{localStorage.setItem(KEY, JSON.stringify(tasks));}catch(e){} }

function render(){
  ['todo','doing','done'].forEach(status=>{
    const list = document.getElementById('list-'+status);
    const items = tasks.filter(t=>t.status===status);
    document.getElementById('count-'+status).textContent = items.length;
    list.innerHTML = items.length ? '' : '<div class="empty">No tasks here</div>';
    items.forEach(t=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.draggable = true;
      card.dataset.id = t.id;
      card.innerHTML = `<p>${escapeHtml(t.text)}</p><div class="card-meta"><span class="tag ${t.priority}">${t.priority}</span><button class="del" title="Delete"><i class="fa-solid fa-trash"></i></button></div>`;
      card.addEventListener('dragstart', ()=>{ dragId = t.id; card.classList.add('dragging'); });
      card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
      const statusControl=document.createElement('select');statusControl.setAttribute('aria-label','Task status for '+t.text);['todo','doing','done'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=({todo:'To Do',doing:'In Progress',done:'Done'})[v];o.selected=t.status===v;statusControl.append(o)});statusControl.addEventListener('change',()=>{t.status=statusControl.value;save();render()});card.append(statusControl);
      card.querySelector('.del').addEventListener('click', ()=>{ tasks = tasks.filter(x=>x.id!==t.id); save(); render(); });
      list.appendChild(card);
    });
  });
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

document.querySelectorAll('.col').forEach(col=>{
  col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
  col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
  col.addEventListener('drop', e=>{
    e.preventDefault();
    col.classList.remove('dragover');
    const t = tasks.find(x=>x.id===dragId);
    if(t){ t.status = col.dataset.status; save(); render(); }
  });
});

function addTask(){
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if(!text) return;
  const priority = document.getElementById('prioritySelect').value;
  tasks.push({id: Date.now(), text, priority, status:'todo'});
  input.value = '';
  save(); render();
}
document.getElementById('addBtn').addEventListener('click', addTask);
document.getElementById('taskInput').addEventListener('keypress', e=>{ if(e.key==='Enter') addTask(); });

render();
</script>
