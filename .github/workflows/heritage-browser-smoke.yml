name: Punjab Heritage browser smoke tests

on:
  pull_request:
    paths:
      - "punjab-heritage/**"
      - ".github/scripts/heritage_browser_smoke.py"
      - ".github/workflows/heritage-browser-smoke.yml"
  push:
    branches:
      - assets/import-object-photos-2026-11
    paths:
      - "punjab-heritage/**"
      - ".github/scripts/heritage_browser_smoke.py"
      - ".github/workflows/heritage-browser-smoke.yml"

permissions:
  contents: read

concurrency:
  group: heritage-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke tests
        run: python .github/scripts/heritage_browser_smoke.py
