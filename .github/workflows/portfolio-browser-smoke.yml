name: Portfolio browser smoke tests

on:
  pull_request:
    paths:
      - "*.html"
      - "quality-fixes.css"
      - "quality-fixes.js"
      - "portfolio-motion.js"
      - "sitemap.xml"
      - ".github/scripts/portfolio_browser_smoke.py"
      - ".github/workflows/portfolio-browser-smoke.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "quality-fixes.css"
      - "quality-fixes.js"
      - "portfolio-motion.js"
      - "sitemap.xml"
      - ".github/scripts/portfolio_browser_smoke.py"
      - ".github/workflows/portfolio-browser-smoke.yml"

permissions:
  contents: read

concurrency:
  group: portfolio-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test sitemap pages on mobile and desktop
        run: python .github/scripts/portfolio_browser_smoke.py
