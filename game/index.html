<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827"><title>Hero 3D — Mobile Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;padding:16px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 8px #000}#brand{font-weight:900;letter-spacing:.12em;font-size:12px;color:#b9d7ff}#score{font-size:22px;font-weight:800}#hint{position:fixed;top:54px;left:50%;transform:translateX(-50%);font-size:12px;color:#d9e5f5;background:#10182799;padding:8px 13px;border:1px solid #ffffff22;border-radius:99px;white-space:nowrap;pointer-events:none}#controls{position:fixed;inset:auto 0 22px;display:flex;justify-content:space-between;align-items:end;padding:0 22px;pointer-events:none}.pad{display:flex;gap:10px;pointer-events:auto}.ctrl{width:62px;height:62px;border-radius:50%;border:1px solid #ffffff55;background:#172b46bb;color:white;font-size:24px;font-weight:700;box-shadow:0 6px 24px #0006;touch-action:none}.ctrl:active{background:#3b82f6}#overlay{position:fixed;inset:0;background:#08111dcc;display:grid;place-items:center;padding:24px}#panel{width:min(420px,100%);text-align:center;padding:28px 22px;border:1px solid #ffffff26;border-radius:24px;background:linear-gradient(145deg,#1c3554,#101827);box-shadow:0 24px 80px #0008}h1{margin:0 0 8px;font-size:30px;letter-spacing:-.04em}p{color:#c2d0e2;line-height:1.5}.start{border:0;border-radius:14px;padding:14px 28px;background:#60a5fa;color:#071426;font-size:16px;font-weight:900}small{color:#91a8c4;display:block;margin-top:14px}@media(min-width:800px){#controls{padding:0 40px 28px}.ctrl{width:70px;height:70px}}
</style>
</head>
<body><div id="game"></div><div id="hud"><div id="brand">HERO 3D<br><span style="color:#fff8;font-weight:500">MOBILE ADVENTURE</span></div><div id="score">0 m</div></div><div id="hint">Dodge the rocks · Collect the gems</div>
<div id="controls"><div class="pad"><button class="ctrl" id="left" aria-label="Move left">‹</button><button class="ctrl" id="right" aria-label="Move right">›</button></div><div class="pad"><button class="ctrl" id="jump" aria-label="Jump">↑</button></div></div>
<div id="overlay"><div id="panel"><div style="font-size:42px">⚔️</div><h1>Hero 3D</h1><p>Run through the valley, dodge the rocks and collect glowing gems. Use the on-screen controls or your keyboard.</p><button class="start" id="start">START ADVENTURE</button><small>Move: ← → / A D &nbsp; Jump: Space / ↑</small></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.querySelector('#game'),scoreEl=document.querySelector('#score'),overlay=document.querySelector('#overlay');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc7e8);scene.fog=new THREE.Fog(0x9bc7e8,24,75);
const camera=new THREE.PerspectiveCamera( sixty=62,innerWidth/innerHeight,.1,120);camera.position.set(0,5.4,10);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f5ff,0x40533b,2));const sun=new THREE.DirectionalLight(0xffe3b0,3);sun.position.set(-5,10,7);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const groundMat=mat(0x567b50),pathMat=mat(0xb7a078),skin=mat(0xc9895b),cloth=mat(0x234e78),gold=mat(0xf6c65b,.3,.55),dark=mat(0x202b36);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),groundMat);floor.rotation.x=-Math.PI/2;floor.position.y=-.08;floor.receiveShadow=true;scene.add(floor);
const road=new THREE.Mesh(new THREE.PlaneGeometry(7,180),pathMat);road.rotation.x=-Math.PI/2;road.position.set(0,-.04,-55);scene.add(road);
for(let i=0;i<34;i++){let z=-i*5;for(let s of [-1,1]){let rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.7+Math.random()*.9,0),mat(i%2?0x627b75:0x8b9b9a));rock.position.set(s*(5+Math.random()*5),.3,z-Math.random()*3);rock.scale.y=.6+Math.random();rock.castShadow=true;scene.add(rock);}}
const hero=new THREE.Group();scene.add(hero);
function part(g,geo,ma,x,y,z){let o=new THREE.Mesh(geo,ma);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o}
part(hero,new THREE.CapsuleGeometry(.34,.75,5,10),cloth,0,1.15,0);
part(hero,new THREE.SphereGeometry(.29,18,14),skin,0,1.9,0);
part(hero,new THREE.CylinderGeometry(.31,.34,.12,16),gold,0,2.18,0);
part(hero,new THREE.ConeGeometry(.16,.3,12),dark,0,2.38,0);
part(hero,new THREE.BoxGeometry(.65,.16,.38),gold,0,1.48,.03);
const armL=part(hero,new THREE.CapsuleGeometry(.12,.48,4,8),skin,-.43,1.25,0),armR=part(hero,new THREE.CapsuleGeometry(.12,.48,4,8),skin,.43,1.25,0);
const legL=part(hero,new THREE.CapsuleGeometry(.14,.48,4,8),dark,-.2,.42,0),legR=part(hero,new THREE.CapsuleGeometry(.14,.48,4,8),dark,.2,.42,0);
const sword=part(hero,new THREE.BoxGeometry(.09,.9,.12),gold,.62,1.45,.02);sword.rotation.z=-.28;
const obstacles=[],gems=[];const rockGeo=new THREE.DodecahedronGeometry(.48,0),gemGeo=new THREE.OctahedronGeometry(.32);
function spawn(){let z=-55-Math.random()*25,lane=[-2,0,2][Math.floor(Math.random()*3)];let o=new THREE.Mesh(rockGeo,mat(0x59636c));o.position.set(lane,.48,z);o.castShadow=true;scene.add(o);obstacles.push(o);if(Math.random()>.3){let g=new THREE.Mesh(gemGeo,gold);g.position.set([ -2,0,2][Math.floor(Math.random()*3)],1.1,z-7);scene.add(g);gems.push(g);}}
let lane=1,jump=0,vy=0,running=false,score=0,speed=13,lastSpawn=0,elapsed=0;
function move(d){lane=Math.max(0,Math.min(2,lane+d));}
function jumpNow(){if(running&&jump<=0){vy=8.5;}}
document.querySelector('#left').onpointerdown=()=>move(-1);document.querySelector('#right').onpointerdown=()=>move(1);document.querySelector('#jump').onpointerdown=jumpNow;
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))move(-1);if(['ArrowRight','d','D'].includes(e.key))move(1);if([' ','ArrowUp','w','W'].includes(e.key))jumpNow();});
document.querySelector('#start').onclick=()=>{overlay.style.display='none';running=true;};
function end(){running=false;overlay.style.display='grid';document.querySelector('#panel').innerHTML='<div style="font-size:42px">🏁</div><h1>Run complete!</h1><p>You travelled '+Math.floor(score)+' metres. Gems collected: '+collected+'.</p><button class="start" id="again">PLAY AGAIN</button>';document.querySelector('#again').onclick=()=>location.reload();}
let collected=0;const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.04);if(running){elapsed+=dt;score+=dt*speed*.7;scoreEl.textContent=Math.floor(score)+' m';if(elapsed-lastSpawn>1.15){spawn();lastSpawn=elapsed;speed=Math.min(23,13+score/180);}
hero.position.x+=(lane-1)*2-hero.position.x;hero.position.z=0;vy-=20*dt;jump=Math.max(0,jump+vy*dt);if(jump===0&&vy<0)vy=0;hero.position.y=jump;
hero.rotation.z+=(0-hero.rotation.z)*dt*8;armL.rotation.x=Math.sin(elapsed*12)*.55;armR.rotation.x=-Math.sin(elapsed*12)*.55;legL.rotation.x=-Math.sin(elapsed*12)*.55;legR.rotation.x=Math.sin(elapsed*12)*.55;
for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];o.position.z+=speed*dt;o.rotation.x+=dt;o.rotation.y+=dt*.7;if(o.position.z>2){scene.remove(o);obstacles.splice(i,1);continue;}if(Math.abs(o.position.z)<.85&&Math.abs(o.position.x-hero.position.x)<.72&&jump<.65){end();}}
for(let i=gems.length-1;i>=0;i--){let g=gems[i];g.position.z+=speed*dt;g.rotation.y+=dt*3;if(g.position.z>2){scene.remove(g);gems.splice(i,1);continue;}if(Math.abs(g.position.z)<.8&&Math.abs(g.position.x-hero.position.x)<.8){collected++;scene.remove(g);gems.splice(i,1);}}
camera.position.x+=(hero.position.x*.22-camera.position.x)*dt*2;camera.lookAt(hero.position.x*.15,1, -2);
}renderer.render(scene,camera);}
frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
