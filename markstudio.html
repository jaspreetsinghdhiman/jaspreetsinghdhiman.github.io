<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarkStudio — Live Markdown Editor | Jaspreet Singh</title>
<meta name="description" content="A live split-pane markdown editor with instant preview and download. Live project by Jaspreet Singh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{--bg:#0b0b12;--surface:#14141f;--surface-2:#1b1b29;--violet:#7c6cf3;--violet-soft:rgba(124,108,243,.15);--amber:#f5b94d;--text:#ededf2;--muted:#8b8a9a;--line:rgba(237,237,242,.1);--display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--body);height:100vh;display:flex;flex-direction:column;}
  a{text-decoration:none;color:inherit;}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 5vw;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--violet),var(--amber));display:flex;align-items:center;justify-content:center;color:#0b0b12;font-family:var(--display);font-weight:700;}
  .brand h1{font-family:var(--display);font-size:1.15rem;font-weight:700;}
  .brand p{font-size:.78rem;color:var(--muted);}
  .actions{display:flex;gap:10px;align-items:center;}
  .btn{font-size:.85rem;color:var(--muted);border:1px solid var(--line);padding:9px 16px;border-radius:100px;transition:.25s;display:inline-flex;align-items:center;gap:8px;background:none;cursor:pointer;font-family:var(--body);}
  .btn:hover{color:var(--text);border-color:var(--violet);background:var(--violet-soft);}
  .btn.primary{background:var(--text);color:#0b0b12;border-color:var(--text);}
  .split{flex:1;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;}
  .pane{display:flex;flex-direction:column;overflow:hidden;}
  .pane-head{padding:10px 20px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface);}
  #editor{flex:1;background:var(--bg);color:var(--text);border:none;resize:none;padding:24px;font-family:var(--mono);font-size:.92rem;line-height:1.7;outline:none;}
  #preview{flex:1;overflow-y:auto;padding:24px 34px;background:var(--surface);border-left:1px solid var(--line);}
  #preview h1,#preview h2,#preview h3{font-family:var(--display);margin:.6em 0 .35em;}
  #preview h1{font-size:1.8rem;} #preview h2{font-size:1.4rem;} #preview h3{font-size:1.15rem;}
  #preview p{margin:.6em 0;line-height:1.7;color:var(--text);}
  #preview code{background:var(--surface-2);padding:2px 7px;border-radius:6px;font-family:var(--mono);font-size:.85em;color:var(--amber);}
  #preview pre{background:var(--surface-2);padding:16px;border-radius:10px;overflow-x:auto;margin:.7em 0;}
  #preview pre code{background:none;padding:0;color:var(--text);}
  #preview blockquote{border-left:3px solid var(--violet);padding-left:16px;color:var(--muted);margin:.7em 0;}
  #preview ul,#preview ol{margin:.5em 0 .5em 1.4em;}
  #preview a{color:var(--violet);text-decoration:underline;}
  #preview img{max-width:100%;border-radius:10px;margin:.5em 0;}
  #preview table{border-collapse:collapse;width:100%;margin:.7em 0;}
  #preview th,#preview td{border:1px solid var(--line);padding:8px 12px;font-size:.88rem;}
  @media (max-width:820px){ .split{grid-template-columns:1fr;grid-template-rows:1fr 1fr;} #preview{border-left:none;border-top:1px solid var(--line);} }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark"><i class="fa-brands fa-markdown"></i></div>
    <div><h1>MarkStudio</h1><p>Live markdown editor &amp; preview</p></div>
  </div>
  <div class="actions">
    <button class="btn" id="downloadBtn"><i class="fa-solid fa-download"></i> Download .md</button>
    <a href="../index.html" class="btn primary"><i class="fa-solid fa-arrow-left"></i> Back to portfolio</a>
  </div>
</header>
<div class="split">
  <div class="pane">
    <div class="pane-head">Markdown</div>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>
  <div class="pane">
    <div class="pane-head">Live Preview</div>
    <div id="preview"></div>
  </div>
</div>

<script>
const DEFAULT_MD = `# Welcome to MarkStudio

A **live** markdown editor built with vanilla JavaScript. Type on the left, see the rendered result instantly on the right.

## Features

- Live preview as you type
- Syntax for \`code\`, **bold**, and _italics_
- Lists, quotes, links, and tables
- Download your work as a .md file

> Built by Jaspreet Singh as a real, working portfolio project.

\`\`\`js
function hello(name) {
  return \`Hello, \${name}!\`;
}
\`\`\`

| Feature | Status |
|---|---|
| Preview | ✅ |
| Export | ✅ |

Try editing this text — the preview updates instantly.
`;

const editor = document.getElementById('editor');
const preview = document.getElementById('preview');

function render(){
  preview.innerHTML = marked.parse(editor.value);
}

editor.value = localStorage.getItem('markstudio-content') || DEFAULT_MD;
render();

editor.addEventListener('input', ()=>{
  localStorage.setItem('markstudio-content', editor.value);
  render();
});

document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const blob = new Blob([editor.value], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'document.md';
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
