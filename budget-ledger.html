<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Ledger — Demo project · Jaspreet Singh</title>
<meta name="description" content="Budget Ledger: a small expense tracker demo built with plain HTML, CSS and JavaScript.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--paper:#f4efe6;--ink:#1b1a17;--mute:#6f6a5e;--line:#d8d0bf;--acc:#c2410c;--card:#fbf8f2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:40px 24px 80px}
.back{font:600 12px ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-decoration:none}
.back:hover{color:var(--acc)}
.demo{display:inline-block;margin-top:18px;font:600 11px ui-sans-serif,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:5px 10px;color:var(--mute)}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(48px,8vw,88px);line-height:.95;margin:18px 0 10px;letter-spacing:-.02em}
h1 em{color:var(--acc)}
.lede{color:var(--mute);max-width:560px;margin-bottom:36px}
.total{display:flex;align-items:baseline;gap:14px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:18px 0;margin-bottom:34px;flex-wrap:wrap}
.total .n{font:500 clamp(40px,6vw,64px)/1 ui-monospace,Menlo,monospace;letter-spacing:-.03em}
.total small{font:600 12px ui-sans-serif,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:40px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
h2{font:600 12px ui-sans-serif,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin-bottom:14px}
form{background:var(--card);border:1px solid var(--line);padding:22px;display:grid;gap:14px}
label{font:600 11px ui-sans-serif,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);display:grid;gap:6px}
input,select{font:16px ui-monospace,Menlo,monospace;background:transparent;border:0;border-bottom:1px solid var(--ink);padding:8px 2px;color:var(--ink);outline:none;border-radius:0}
input:focus,select:focus{border-bottom-color:var(--acc)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{font:600 13px ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:0;padding:14px;cursor:pointer}
button:hover{background:var(--acc)}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.ghost:hover{background:var(--ink);color:var(--paper)}
.bars{display:grid;gap:12px;margin-bottom:30px}
.bar{display:grid;grid-template-columns:90px 1fr 80px;gap:12px;align-items:center;font:14px ui-monospace,monospace}
.track{height:10px;background:var(--line)}
.fill{height:100%;background:var(--acc);width:0;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.list{list-style:none;border-top:1px solid var(--ink)}
.list li{display:grid;grid-template-columns:86px 1fr auto 28px;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.list .d{font:13px ui-monospace,monospace;color:var(--mute)}
.list .c{font:600 11px ui-sans-serif,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
.list .a{font:500 15px ui-monospace,monospace;text-align:right}
.del{background:none;color:var(--mute);padding:0;font-size:18px;line-height:1}
.del:hover{color:var(--acc);background:none}
.empty{color:var(--mute);font-style:italic;padding:18px 0}
.tools{display:flex;gap:10px;margin-top:16px}
.tools button{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="work.html">← Back to work</a><br>
  <span class="demo">Demo project · Plain HTML, CSS &amp; JavaScript</span>
  <h1>Budget <em>Ledger</em></h1>
  <p class="lede">A small expense tracker. Log what you spend, see where it goes this month, and export it. Your data stays in this browser only.</p>

  <div class="total"><span class="n" id="total">₹0</span><small id="monthLabel">This month</small></div>

  <div class="grid">
    <section>
      <h2>Add an expense</h2>
      <form id="addForm" autocomplete="off">
        <div class="row">
          <label>Amount (₹)<input id="amount" type="number" min="1" step="1" required></label>
          <label>Date<input id="date" type="date" required></label>
        </div>
        <label>Category
          <select id="category">
            <option>Food</option><option>Transport</option><option>Bills</option><option>Fun</option><option>Other</option>
          </select>
        </label>
        <label>Note<input id="note" maxlength="60" placeholder="e.g. groceries"></label>
        <button type="submit">Add entry</button>
      </form>
      <div class="tools">
        <button class="ghost" id="exportBtn" type="button">Export CSV</button>
        <button class="ghost" id="clearBtn" type="button">Clear all</button>
      </div>
    </section>

    <section>
      <h2>Where it goes</h2>
      <div class="bars" id="bars"></div>
      <h2>Recent</h2>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>No entries yet. Add your first one.</p>
    </section>
  </div>
</div>

<script>
(function(){
  const KEY="budget-ledger.v1";
  const CATS=["Food","Transport","Bills","Fun","Other"];
  const fmt=n=>"₹"+Math.round(n).toLocaleString("en-IN");
  let items=[];
  try{items=JSON.parse(localStorage.getItem(KEY)||"[]");}catch(e){items=[];}
  const save=()=>localStorage.setItem(KEY,JSON.stringify(items));
  const ymd=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};
  const $=id=>document.getElementById(id);

  $("date").value=ymd(new Date());
  const now=new Date();
  $("monthLabel").textContent=now.toLocaleString("en-IN",{month:"long",year:"numeric"});

  function render(){
    const monthKey=ymd(new Date()).slice(0,7);
    const thisMonth=items.filter(i=>i.date.startsWith(monthKey));
    const total=thisMonth.reduce((s,i)=>s+i.amount,0);
    $("total").textContent=fmt(total);

    const byCat=Object.fromEntries(CATS.map(c=>[c,0]));
    thisMonth.forEach(i=>byCat[i.category]+=i.amount);
    const max=Math.max(1,...Object.values(byCat));
    const bars=$("bars");bars.innerHTML="";
    CATS.forEach(c=>{
      const row=document.createElement("div");row.className="bar";
      row.innerHTML='<span></span><div class="track"><div class="fill"></div></div><span style="text-align:right"></span>';
      row.children[0].textContent=c;
      row.children[2].textContent=fmt(byCat[c]);
      row.querySelector(".fill").style.width=(byCat[c]/max*100)+"%";
      bars.appendChild(row);
    });

    const list=$("list");list.innerHTML="";
    const sorted=[...items].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,12);
    sorted.forEach(i=>{
      const li=document.createElement("li");
      const d=document.createElement("span");d.className="d";d.textContent=i.date.slice(5);
      const n=document.createElement("span");n.textContent=i.note||i.category;
      const c=document.createElement("span");c.className="c";c.textContent=i.category;
      const a=document.createElement("span");a.className="a";a.textContent=fmt(i.amount);
      const x=document.createElement("button");x.className="del";x.type="button";x.setAttribute("aria-label","Delete entry");x.textContent="×";
      x.onclick=()=>{items=items.filter(z=>z.id!==i.id);save();render();};
      const wrap=document.createElement("span");wrap.append(c);
      li.append(d,n,wrap,a,x);
      list.appendChild(li);
    });
    $("empty").hidden=items.length>0;
  }

  $("addForm").addEventListener("submit",e=>{
    e.preventDefault();
    const amount=Math.round(+$("amount").value);
    if(!amount||amount<1) return;
    items.push({id:Date.now(),amount,date:$("date").value||ymd(new Date()),category:$("category").value,note:$("note").value.trim()});
    save();render();
    $("amount").value="";$("note").value="";$("amount").focus();
  });

  $("exportBtn").onclick=()=>{
    const rows=[["date","category","amount","note"],...items.map(i=>[i.date,i.category,i.amount,'"'+(i.note||"").replace(/"/g,'""')+'"'])];
    const blob=new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="budget-ledger.csv";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  $("clearBtn").onclick=()=>{ if(items.length && confirm("Delete all entries?")){items=[];save();render();} };

  render();
})();
</script>
</body>
</html>
