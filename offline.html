<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d08">
  <meta name="robots" content="noindex">
  <title>You're offline | Jaspreet Singh</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d08;--fg:#f1f3df;--muted:#929879;--accent:#b5c95b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 25%,#252d15 0,transparent 42%),var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}
    main{width:min(560px,100%);text-align:center}
    .mark{width:72px;height:72px;display:grid;place-items:center;margin:0 auto 28px;border:1px solid #59652c;border-radius:22px;color:var(--accent);font-size:30px;font-weight:800}
    .eyebrow{color:var(--accent);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:14px 0;font-size:clamp(38px,9vw,64px);line-height:1.02;letter-spacing:-.06em}
    p{color:var(--muted);max-width:430px;margin:0 auto 28px}
    button{min-height:48px;padding:0 22px;border:0;border-radius:999px;background:var(--accent);color:#0b0d08;font-weight:700;cursor:pointer}
    a{display:inline-block;margin-top:20px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">JS</div>
    <div class="eyebrow">Jaspreet Singh · Frontend Developer</div>
    <h1>You're offline.</h1>
    <p>This page isn't available right now. Reconnect to the internet and try again. Previously cached portfolio pages and assets may still be available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <br><a href="/">Back to portfolio home</a>
  </main>
</body>
</html>
